<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>crabcap</title>
  <link rel="stylesheet" href="capture.css" />
</head>
<body>
  <div id="toolbar">
    <span id="logo">🦀 crabcap</span>
    <span id="size"></span>
    <label>len
      <select id="secs">
        <option value="3">3s</option>
        <option value="5" selected>5s</option>
        <option value="10">10s</option>
        <option value="15">15s</option>
      </select>
    </label>
    <label>fps
      <select id="fps">
        <option value="10">10</option>
        <option value="15" selected>15</option>
        <option value="25">25</option>
      </select>
    </label>
    <button id="rec" title="Record the framed region">● rec</button>
    <span id="status"></span>
    <button id="close" title="Hide crabcap">✕</button>
  </div>
  <div id="region"></div>
  <div id="grip" title="Drag to resize"></div>
  <script type="module" src="capture.js"></script>
</body>
</html>
