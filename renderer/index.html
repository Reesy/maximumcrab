<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>maximumcrab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bubble" class="hidden">
    <div class="bubble-card">
      <div class="bubble-header">
        <span id="bubble-title"></span>
        <span id="bubble-spinner" class="spinner hidden"></span>
      </div>
      <div id="bubble-body"></div>
      <div id="bubble-foot" class="hidden"></div>
    </div>
    <div class="bubble-tail"></div>
  </div>
  <div id="crab">
    <canvas id="crab-canvas"></canvas>
    <div id="shadow"></div>
  </div>
  <script src="crab.js"></script>
  <script src="app.js"></script>
</body>
</html>
